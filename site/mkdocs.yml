          - "%wilcoxon": reference/wilcoxon.md
          - "%chisq": reference/chisq.md
          - "%fisher": reference/fisher.md
          - "%cmh": reference/cmh.md
          - "%ancova": reference/ancova.md
          - "%adjust": reference/adjust.md
      - Compare groups with a model:
