site_name: Sapling SAS macros
site_description: SAS macros for the tables, listings and figures of clinical trials, proven against pharmaverse references.
site_url: https://datastep-labs.github.io/sapling-sas/
repo_url: https://github.com/datastep-labs/sapling-sas
repo_name: datastep-labs/sapling-sas
edit_uri: ""
copyright: Copyright 2026 DataStep Labs. The macros are source available under a commercial license. Commercial use and price - <a href="mailto:datastep.studio@gmail.com">datastep.studio@gmail.com</a>

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorial:
      - tutorial/index.md
  - How-to guides:
      - how-to/index.md
      - how-to/own-program.md
      - how-to/run-the-examples.md
      - how-to/derive-baseline.md
      - how-to/demographic-table.md
      - how-to/adverse-event-table.md
      - how-to/efficacy-table.md
      - how-to/kaplan-meier-figure.md
      - how-to/page-per-subgroup.md
      - how-to/check-a-table.md
  - Reference:
      - reference/index.md
      - Start a program:
          - "%study": reference/study.md
          - "%import_xpt": reference/import_xpt.md
      - Describe the data:
          - "%describe": reference/describe.md
          - "%freq": reference/freq.md
          - "%proportion": reference/proportion.md
          - "%rate": reference/rate.md
          - "%worst": reference/worst.md
          - "%termflags": reference/termflags.md
      - Test the groups:
